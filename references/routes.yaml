# routes.yaml — 网页访问路由决策配置表
# 用途：决策树 V4 第 0 层 OpenCLI 快捷通道查表使用
# 生成日期：2026-04-11
# 来源：opencli v1.5.6 list 输出 + eze-is/web-access 开源版整理
# 维护：每次 opencli 升级后重新生成

---

## 分类说明

# opencli_type 取值：
#   - public: 无需登录，直接执行，0 依赖，1-3 秒
#   - cookie: 需登录态，检查 Bridge 连接后执行 (opencli doctor)
#   - intercept: 需拦截浏览器请求获取数据，依赖 Bridge 登录态
#   - ui: 需要桌面应用 CDP 操作，不走 OpenCLI 快捷通道，降级到 CDP
#
# 不在本文件中的站点：
#   → 无 OpenCLI 适配，自动进入决策树第 1 层并行执行（WebFetch + CDP）

---

